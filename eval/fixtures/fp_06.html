<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FP-06: User Profiles</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .profile-card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; text-align: center; }
        .img-regular { width: 100px; height: 100px; border-radius: 50%; background: #ddd; margin: 0 auto 10px; }
        .img-large { width: 200px; height: 200px; background: #ddd; margin: 0 auto 10px; }
        .img-small { width: 32px; height: 32px; border-radius: 50%; background: #ddd; display: inline-block; }
        .css-bg-face { width: 100px; height: 100px; border-radius: 50%; background-image: url('placeholder.jpg'); background-color: #ddd; background-size: cover; margin: 0 auto 10px; }
        .occluded-face { width: 100px; height: 100px; background: #ddd; margin: 0 auto 10px; position: relative; overflow: hidden; }
        .occluded-face::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40px; background: rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <h1>Team Directory</h1>
    
    <div style="display: flex; align-items: center; margin-bottom: 20px;">
        <div id="small-face" class="img-small" aria-label="Small avatar"></div>
        <span style="margin-left: 10px; font-weight: bold;">Logged in as User</span>
    </div>

    <div class="grid">
        <div class="profile-card">
            <div id="face-standard" class="img-regular" title="Frontal face"></div>
            <h3>Alice Smith</h3>
            <p>Engineer</p>
        </div>
        <div class="profile-card">
            <div id="face-large" class="img-large" title="Large face"></div>
            <h3>Bob Jones</h3>
            <p>Manager</p>
        </div>
        <div class="profile-card">
            <div id="face-css-bg" class="css-bg-face" title="Face in CSS background"></div>
            <h3>Charlie Day</h3>
            <p>Designer</p>
        </div>
        <div class="profile-card">
            <div id="face-occluded" class="occluded-face" title="Partially occluded face"></div>
            <h3>Diana Prince</h3>
            <p>Analyst</p>
        </div>
    </div>
</body>
</html>

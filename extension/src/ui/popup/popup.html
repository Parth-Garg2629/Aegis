<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEGIS Agent</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-deep:    #080c14;
      --bg-surface: #0d1424;
      --bg-card:    #111827;
      --bg-hover:   #1a2236;
      --border:     rgba(99,130,201,0.18);
      --border-glow:rgba(56,189,248,0.35);
      --accent:     #38bdf8;
      --accent-dim: rgba(56,189,248,0.12);
      --accent-glow:rgba(56,189,248,0.25);
      --green:      #22c55e;
      --red:        #ef4444;
      --amber:      #f59e0b;
      --text:       #f1f5f9;
      --text-muted: #64748b;
      --text-dim:   #94a3b8;
      --pulse-1:    rgba(56,189,248,0.6);
      --pulse-2:    rgba(56,189,248,0);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      min-height: 480px;
      background: var(--bg-deep);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #0d1424 0%, #0a1220 100%);
      position: relative;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 18px; right: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
    }
    .logo-ring {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      background: var(--accent-dim);
      box-shadow: 0 0 12px var(--accent-glow), inset 0 0 8px var(--accent-dim);
      flex-shrink: 0;
    }
    .logo-ring svg { width: 16px; height: 16px; }
    .header-text h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
      line-height: 1;
    }
    .header-text p {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .connection-dot {
      margin-left: auto;
      display: flex; align-items: center; gap: 5px;
      font-size: 10px;
      color: var(--text-muted);
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .dot.online {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.5; }
    }

    /* ── Status bar ── */
    .status-bar {
      margin: 14px 16px 0;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .status-left { display: flex; align-items: center; gap: 8px; }
    .status-icon-wrap {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: var(--accent-dim);
      border: 1px solid var(--border-glow);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .status-icon-wrap svg { width: 14px; height: 14px; color: var(--accent); }
    .status-info p { font-size: 11px; color: var(--text-muted); }
    .status-info strong {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }
    #agent-status { color: var(--text-dim); transition: color 0.3s; }
    #agent-status.running  { color: var(--accent); }
    #agent-status.completed{ color: var(--green); }
    #agent-status.failed, #agent-status.cancelled { color: var(--red); }

    /* Step pill */
    .step-pill {
      display: flex; align-items: center; gap: 4px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      font-weight: 500;
    }
    .step-pill svg { width: 11px; height: 11px; color: var(--accent); }

    /* ── Progress bar ── */
    .progress-wrap {
      margin: 10px 16px 0;
      height: 3px;
      background: var(--bg-card);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-track {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #818cf8);
      border-radius: 99px;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* ── Goal section ── */
    .section-label {
      margin: 14px 16px 6px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .goal-wrap {
      margin: 0 16px;
      position: relative;
    }
    .goal-wrap textarea {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
      padding: 11px 12px;
      resize: none;
      min-height: 76px;
      max-height: 120px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .goal-wrap textarea::placeholder { color: var(--text-muted); }
    .goal-wrap textarea:focus {
      border-color: var(--border-glow);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .goal-wrap textarea:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Actions ── */
    .actions {
      margin: 12px 16px 0;
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      height: 40px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s, background 0.2s;
      user-select: none;
    }
    .btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #fff;
      box-shadow: 0 4px 14px rgba(14,165,233,0.3);
    }
    .btn-primary:not(:disabled):hover {
      box-shadow: 0 6px 20px rgba(14,165,233,0.45);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      box-shadow: 0 4px 14px rgba(239,68,68,0.25);
    }
    .btn-danger:not(:disabled):hover {
      box-shadow: 0 6px 20px rgba(239,68,68,0.4);
      transform: translateY(-1px);
    }

    /* ── Activity log ── */
    .log-section {
      margin: 14px 16px 0;
    }
    .log-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      min-height: 70px;
      max-height: 100px;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .log-box::-webkit-scrollbar { width: 4px; }
    .log-box::-webkit-scrollbar-track { background: transparent; }
    .log-box::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 99px; }

    .log-entry {
      display: flex; align-items: flex-start; gap: 7px;
      font-size: 11px;
      line-height: 1.4;
      animation: slide-in 0.2s ease;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .log-time {
      color: var(--text-muted);
      font-size: 10px;
      white-space: nowrap;
      margin-top: 1px;
      font-variant-numeric: tabular-nums;
    }
    .log-text { color: var(--text-dim); }
    .log-text.action  { color: var(--accent); }
    .log-text.success { color: var(--green); }
    .log-text.error   { color: var(--red); }
    .log-empty {
      color: var(--text-muted);
      font-size: 11px;
      text-align: center;
      margin: auto;
      padding: 8px 0;
    }

    /* ── Footer ── */
    .footer {
      margin: 12px 16px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-tag {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }
    .footer-ver {
      font-size: 10px;
      color: var(--text-muted);
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 8px;
    }

    /* ── Scanning animation when running ── */
    @keyframes scanline {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(400%);  }
    }
    .scanning .progress-track::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      animation: scanline 1.8s linear infinite;
    }

    /* ── Confirmation overlay ── */
    .confirm-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 100;
      background: rgba(8, 12, 20, 0.92);
      backdrop-filter: blur(4px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 18px;
      gap: 14px;
      animation: overlay-in 0.2s ease;
    }
    .confirm-overlay.active { display: flex; }
    @keyframes overlay-in {
      from { opacity: 0; transform: scale(0.97); }
      to   { opacity: 1; transform: scale(1); }
    }
    .confirm-card {
      width: 100%;
      background: var(--bg-card);
      border: 1.5px solid rgba(245,158,11,0.5);
      border-radius: 14px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 0 24px rgba(245,158,11,0.12);
    }
    .confirm-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .confirm-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(245,158,11,0.15);
      border: 1.5px solid rgba(245,158,11,0.5);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .confirm-icon svg { width: 16px; height: 16px; color: var(--amber); }
    .confirm-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--amber);
      letter-spacing: 0.01em;
    }
    .confirm-subtitle {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
    }
    .confirm-rows {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .confirm-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .confirm-row-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      min-width: 52px;
      padding-top: 1px;
    }
    .confirm-row-value {
      font-size: 12px;
      color: var(--text);
      font-weight: 500;
      word-break: break-all;
    }
    .confirm-row-value.risk {
      color: var(--amber);
    }
    .confirm-actions {
      display: flex;
      gap: 8px;
    }
    .btn-approve {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      height: 38px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff;
      box-shadow: 0 4px 14px rgba(22,163,74,0.3);
    }
    .btn-approve:hover { box-shadow: 0 6px 20px rgba(22,163,74,0.45); transform: translateY(-1px); }
    .btn-approve:active { transform: scale(0.97); }
    .btn-deny {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      height: 38px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      box-shadow: 0 4px 14px rgba(239,68,68,0.25);
    }
    .btn-deny:hover { box-shadow: 0 6px 20px rgba(239,68,68,0.4); transform: translateY(-1px); }
    .btn-deny:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>AEGIS</h1>
      <p>Browser Agent</p>
    </div>
    <div class="connection-dot">
      <div class="dot" id="conn-dot"></div>
      <span id="conn-label">Offline</span>
    </div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-left">
      <div class="status-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 8v4l2 2"/>
        </svg>
      </div>
      <div class="status-info">
        <p>Status</p>
        <strong id="agent-status">Idle</strong>
      </div>
    </div>
    <div class="step-pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <span id="step-counter">0 / 30</span>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-track" id="progress-track" style="width:0%"></div>
  </div>

  <!-- Goal input -->
  <div class="section-label">Task Goal</div>
  <div class="goal-wrap">
    <textarea id="goal-input" placeholder="Describe what you want AEGIS to do…&#10;e.g. Search for computer science scholarships and click the first result." rows="3"></textarea>
  </div>

  <!-- Buttons -->
  <div class="actions">
    <button id="start-btn" class="btn btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
      Start Agent
    </button>
    <button id="cancel-btn" class="btn btn-danger" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
      Stop
    </button>
  </div>

  <!-- Activity log -->
  <div class="log-section">
    <div class="section-label" style="margin-top:12px; margin-bottom:6px; margin-left:0;">Activity</div>
    <div class="log-box" id="log-box">
      <p class="log-empty" id="log-empty">No activity yet.</p>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-tag">AEGIS — Guarded Intelligent Surfing</span>
    <span class="footer-ver">v1.0.0</span>
  </div>

  <script type="module" src="./popup.ts"></script>

  <!-- ─────────────────────────────────────────────────────────────────────
       Confirmation overlay — shown only when risk=high_risk and the loop
       is paused waiting for user Approve / Deny.
       Privacy: displays only action type, element ID, and risk reason.
       Does NOT display passwords, raw DOM, screenshots, or VLM reasoning.
  ──────────────────────────────────────────────────────────────────────── -->
  <div class="confirm-overlay" id="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-title-text">
    <div class="confirm-card">
      <div class="confirm-header">
        <div class="confirm-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <div>
          <div class="confirm-title" id="confirm-title-text">Action Requires Confirmation</div>
          <div class="confirm-subtitle">Review this high-risk action before proceeding</div>
        </div>
      </div>

      <div class="confirm-rows">
        <div class="confirm-row">
          <span class="confirm-row-label">Action</span>
          <span class="confirm-row-value" id="confirm-action-type">—</span>
        </div>
        <div class="confirm-row">
          <span class="confirm-row-label">Target</span>
          <span class="confirm-row-value" id="confirm-target">—</span>
        </div>
        <div class="confirm-row">
          <span class="confirm-row-label">Risk</span>
          <span class="confirm-row-value risk" id="confirm-risk-reason">High Risk</span>
        </div>
      </div>

      <div class="confirm-actions">
        <button id="approve-btn" class="btn-approve">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Approve
        </button>
        <button id="deny-btn" class="btn-deny">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          Deny
        </button>
      </div>
    </div>
  </div>
</body>
</html>
